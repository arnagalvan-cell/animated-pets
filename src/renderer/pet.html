<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: transparent !important; overflow: hidden; width: 100%; height: 100%; user-select: none; }
    #pet-container { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); cursor: grab; overflow: visible; }
    #pet-container:active { cursor: grabbing; }
    #pet-canvas { display: block; }

    #shop-btn {
      position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.5);
      color: white; border: none; border-radius: 50%; width: 28px; height: 28px;
      font-size: 14px; cursor: pointer; opacity: 0; transition: opacity 0.3s;
    }
    body:hover #shop-btn { opacity: 1; }
    #size-hint {
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.55); color: #fff; font-family: system-ui, sans-serif;
      font-size: 11px; padding: 2px 8px; border-radius: 10px; white-space: nowrap;
      pointer-events: none; opacity: 0; transition: opacity 0.3s;
    }
    #size-hint.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="pet-container">
    <canvas id="pet-canvas"></canvas>

    <div id="size-hint">100%</div>
  </div>
  <button id="shop-btn" title="Tienda">🛍️</button>

  <script>
    const canvas  = document.getElementById('pet-canvas')
    const ctx     = canvas.getContext('2d')
    const sizeHint= document.getElementById('size-hint')
    const shopBtn = document.getElementById('shop-btn')

    let config, state, images = {}, clicks = 0, scale = 1.0, displayH = 200
    let loopStarted = false

    let anim = {
      name: '', frame: 0, frameCount: 1,
      frameW: 450, frameH: 824, fps: 12,
      playing: false, elapsed: 0, onDone: null
    }

    function loadAnim(name) {
      if (!config || !config.pet.animations[name]) return
      const cfg = config.pet.animations[name]
      anim.name       = name
      anim.frame      = 0
      anim.frameCount = cfg.frames
      anim.frameW     = cfg.frameWidth
      anim.frameH     = cfg.frameHeight
      anim.fps        = config.pet.fps
      anim.elapsed    = 0
      anim.onDone     = null
      updateCanvasSize()
    }

    function updateCanvasSize() {
      const h = Math.round(displayH * scale)
      const w = Math.round(h * anim.frameW / anim.frameH)
      canvas.width  = w
      canvas.height = h
    }

    function play(name, onDone) {
      if (!config.pet.animations[name]) {
        if (onDone) onDone()
        return
      }
      loadAnim(name)
      anim.playing = true
      anim.onDone  = onDone || null
    }

    function drawFrame() {
      if (!images[anim.name]) return
      ctx.clearRect(0, 0, canvas.width, canvas.height)
      const sy = anim.frame * anim.frameH
      ctx.drawImage(images[anim.name], 0, sy, anim.frameW, anim.frameH, 0, 0, canvas.width, canvas.height)
    }

    let lastTime = 0
    function loop(ts) {
      const dt = Math.min(ts - lastTime, 50)
      lastTime = ts

      if (anim.playing && images[anim.name]) {
        anim.elapsed += dt
        const frameDuration = 1000 / anim.fps
        if (anim.elapsed >= frameDuration) {
          anim.elapsed -= frameDuration
          anim.frame++
          if (anim.frame >= anim.frameCount) {
            anim.frame = anim.frameCount - 1  // Quedarse en último frame
            anim.playing = false
            drawFrame()
            if (anim.onDone) { const cb = anim.onDone; anim.onDone = null; cb() }
          } else {
            drawFrame()
          }
        }
      }

      requestAnimationFrame(loop)
    }

    async function init() {
      config   = await window.petAPI.getConfig()
      state    = await window.petAPI.getState()
      displayH = config.pet.displayHeight
      scale    = state.scale
      clicks   = state.clicks
      document.getElementById('pet-container').style.opacity = state.opacity

      const anims = config.pet.animations
      const animKeys = Object.keys(anims)

      let loaded = 0
      const total = animKeys.length

      for (const [name, animCfg] of Object.entries(anims)) {
        const img = new Image()
        const base = config.appPath.endsWith('/') ? config.appPath : config.appPath + '/'
        img.src = `file:///${base}${animCfg.sprite}`
        img.onload = () => { images[name] = img; loaded++; if (loaded === total) start() }
        img.onerror = () => { console.warn('Failed to load:', animCfg.sprite); loaded++; if (loaded === total) start() }
      }
    }

    function start() {
      const allAnims = Object.keys(config.pet.animations)
      loadAnim(allAnims[0])
      drawFrame()
      // Sound loaded via onReloadClickSound event from main process
      if (!loopStarted) {
        loopStarted = true
        requestAnimationFrame(loop)
      }
    }

    let wasDragging = false
    let clickAnimIndex = 0
    // Click sound
let clickAudio = null
function initClickSound(soundPath) {
  if (soundPath) {
    try {
      const normalized = soundPath.replace(/\\/g, '/')
      const url = normalized.startsWith('/') ? 'file://' + normalized : 'file:///' + normalized
      clickAudio = new Audio(url)
      clickAudio.volume = 0.8
      clickAudio.load()
    } catch(e) { console.log('Sound init error:', e) }
  }
}
function playClickSound() {
  if (!clickAudio) return
  try { clickAudio.currentTime = 0; clickAudio.play().catch(e => {}) } catch(e) {}
}

// Listen for sound updates from main process
if (window.petAPI && window.petAPI.onReloadClickSound) {
  window.petAPI.onReloadClickSound((data) => {
    initClickSound(data.soundPath)
  })
}

canvas.addEventListener('click', () => {
      if (wasDragging) return
      playClickSound()
      window.petAPI.addClick()
      clicks++

      if (!anim.playing) {
        const allAnims = Object.keys(config.pet.animations)
        if (allAnims.length === 0) return

        const pick = allAnims[clickAnimIndex]
        clickAnimIndex = (clickAnimIndex + 1) % allAnims.length

        play(pick, () => {
          // Al terminar el ciclo completo, volver a Animación 1 frame 0
          if (clickAnimIndex === 0) {
            loadAnim(allAnims[0])
            drawFrame()
          }
          // Si no es la última, quedarse en último frame esperando siguiente clic
        })
      }
    })

    shopBtn.addEventListener('click', () => window.petAPI.openShop())

    let dragging = false, dragOffX = 0, dragOffY = 0, dragStartX = 0, dragStartY = 0
    canvas.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return
      dragging = true; wasDragging = false
      dragStartX = e.screenX; dragStartY = e.screenY
      dragOffX = e.screenX - window.screenX
      dragOffY = e.screenY - window.screenY
    })
    document.addEventListener('mousemove', (e) => {
      if (!dragging) return
      if (Math.abs(e.screenX - dragStartX) + Math.abs(e.screenY - dragStartY) > 5) wasDragging = true
      const newX = e.screenX - dragOffX
      const newY = e.screenY - dragOffY
      window.moveTo(newX, newY)
    })
    document.addEventListener('mouseup', () => { dragging = false; setTimeout(() => { wasDragging = false }, 80) })

    let sizeHintTimer = null
    document.addEventListener('wheel', (e) => {
      e.preventDefault()
      const dir = e.deltaY < 0 ? 1 : -1
      scale = Math.round(Math.min(2.5, Math.max(0.3, scale + dir * 0.05)) * 100) / 100
      updateCanvasSize()
      drawFrame()
      window.petAPI.saveScale(scale)
      sizeHint.textContent = `${Math.round(scale * 100)}%`
      sizeHint.classList.add('show')
      clearTimeout(sizeHintTimer)
      sizeHintTimer = setTimeout(() => sizeHint.classList.remove('show'), 1500)
    }, { passive: false })

    window.petAPI.onClicksUpdated((v) => { clicks = v })
    window.petAPI.onSetOpacity((v) => { document.getElementById('pet-container').style.opacity = v })

    // Seasonal skin overlay
    let seasonalOverlay = null

    window.petAPI.onSetScale((v) => {
      scale = v; updateCanvasSize(); drawFrame()
      if (seasonalOverlay) {
        seasonalOverlay.style.width  = canvas.width  + 'px'
        seasonalOverlay.style.height = canvas.height + 'px'
      }
    })
    window.petAPI.onApplySeasonalSkin((data) => {
      if (seasonalOverlay) seasonalOverlay.remove()
      const img = document.createElement('img')
      img.src = `file:///${data.overlayPath}`
      img.style.cssText = `
        position: absolute;
        bottom: 0; left: 0;
        width: ${canvas.width}px;
        height: ${canvas.height}px;
        object-fit: fill;
        pointer-events: none;
        z-index: 10;
        opacity: ${data.config.opacity || 0.9};
      `
      document.getElementById('pet-container').appendChild(img)
      seasonalOverlay = img
    })

    window.petAPI.onRemoveSeasonalSkin(() => {
      if (seasonalOverlay) { seasonalOverlay.remove(); seasonalOverlay = null }
    })

    init()
  </script>
</body>
</html>
